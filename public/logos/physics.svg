<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="physGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orbitCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="orbitPurple" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="orbitEmerald" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="nucleusGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="atomGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#06b6d4" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Ambient Gauge Shield -->
  <circle cx="256" cy="256" r="236" fill="url(#physGlow)"/>
  <circle cx="256" cy="256" r="220" fill="#020612" stroke="url(#orbitCyan)" stroke-width="4" stroke-opacity="0.9"/>
  <circle cx="256" cy="256" r="206" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="6 6" stroke-opacity="0.45"/>

  <!-- Quantum Wave Harmonics running across background -->
  <path d="M 80,256 Q 124,210 168,256 T 256,256 T 344,256 T 432,256" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.3" stroke-dasharray="4 3"/>

  <!-- 3 Quantum Electron Orbital Rings -->
  <g filter="url(#atomGlow)">
    <!-- Ring 1: -35 deg tilt -->
    <ellipse cx="256" cy="256" rx="140" ry="50" fill="none" stroke="url(#orbitCyan)" stroke-width="5" transform="rotate(-35 256 256)"/>
    <!-- Ring 2: +35 deg tilt -->
    <ellipse cx="256" cy="256" rx="140" ry="50" fill="none" stroke="url(#orbitPurple)" stroke-width="5" transform="rotate(35 256 256)"/>
    <!-- Ring 3: 90 deg tilt (Vertical) -->
    <ellipse cx="256" cy="256" rx="140" ry="50" fill="none" stroke="url(#orbitEmerald)" stroke-width="5" transform="rotate(90 256 256)"/>
  </g>

  <!-- Orbiting Electrons with glow halos -->
  <!-- Electron 1 on Ring 1 -->
  <circle cx="370" cy="176" r="12" fill="#38bdf8" fill-opacity="0.35"/>
  <circle cx="370" cy="176" r="6" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>

  <!-- Electron 2 on Ring 2 -->
  <circle cx="142" cy="176" r="12" fill="#c084fc" fill-opacity="0.35"/>
  <circle cx="142" cy="176" r="6" fill="#c084fc" stroke="#ffffff" stroke-width="2"/>

  <!-- Electron 3 on Ring 3 (top) -->
  <circle cx="256" cy="116" r="12" fill="#34d399" fill-opacity="0.35"/>
  <circle cx="256" cy="116" r="6" fill="#34d399" stroke="#ffffff" stroke-width="2"/>

  <!-- Dense Radiant Atomic Nucleus Core -->
  <circle cx="256" cy="256" r="42" fill="#06b6d4" fill-opacity="0.25"/>
  <circle cx="256" cy="256" r="28" fill="#0369a1" stroke="#38bdf8" stroke-width="2.5"/>
  
  <!-- Nucleon Clusters (Protons Rose, Neutrons Sky) -->
  <circle cx="250" cy="250" r="8" fill="#f43f5e" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="262" cy="250" r="8" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="250" cy="262" r="8" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="262" cy="262" r="8" fill="#f43f5e" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="256" cy="256" r="4" fill="#ffffff"/>

  <!-- Specular flare glint -->
  <ellipse cx="246" cy="242" rx="6" ry="3" fill="#ffffff" fill-opacity="0.8" transform="rotate(-30 246 242)"/>
</svg>
